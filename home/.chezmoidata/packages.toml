[packages.ubuntu]
apt = [
  "ca-certificates",
  "bat",
  "bruno",
  "build-essential",
  "code",
  "clang-20",
  "cmake",
  "curl",

  "containerd.io",
  "docker-buildx-plugin",
  "docker-ce",
  "docker-ce-cli",
  "docker-compose-plugin",

  "dotnet-sdk-10.0",
  "eza",
  "flameshot",
  "fontconfig",
  "fzf",
  "git",
  "gh",
  "gir1.2-gtop-2.0",
  "gstreamer1.0-gtk4",
  "gstreamer1.0-plugins-bad",
  "gstreamer1.0-plugins-good",
  "gstreamer1.0-plugins-ugly",
  "gpg",
  "google-chrome-stable",
  "1password",
  "1password-cli",
  "pass",
  "debsig-verify",
  "jq",
  "just",
  "libnss3-tools",
  # AppImages need FUSE 2, which Ubuntu has not installed by default since 22.04.
  "libfuse2t64",
  "helm",
  "libvulkan-dev",
  "lld-20",
  "lm-sensors",
  "lsof",
  "kubectl",
  "kubectx",
  "openssh-client",
  "openssl",
  "python3",
  "qt6-wayland",
  "ripgrep",
  "mise",
  "ninja-build",
  "tmux",
  "unzip",
  "vulkan-tools",
  "wget",
  "wl-clipboard",
  "xdg-utils",
  "zoxide",
  "zsh",
]

[packages.dotnet]
sdk_version = "10.0.301"

[packages.ubuntu.profile_apt]
private = ["spotify-client"]
# Microsoft Edge accompanies the Intune Portal: the vendor installer treats it as
# a dependency, and device compliance sign-in goes through it. It does not become
# the system browser.
company = ["snapd", "forticlient", "intune-portal", "microsoft-edge-stable"]

[packages.ubuntu.profile_snaps]
company = ["rider"]

