[[packages.ubuntu.repositories]]
name = "forticlient"
profile = "company"
label = "FortiClient Stable"
# The branch is the one the company EMS at ems.qliro.tech manages, not the newest
# one Fortinet publishes: an EMS registers a FortiClient of its own branch and
# turns a newer one away with "FCT version is not supported". See ADR 0007.
repository_uri = "https://repo.fortinet.com/repo/forticlient/7.2/ubuntu/"
# Fortinet signs every branch of this repository with one key, so moving between
# branches keeps the pinned fingerprint below.
key_url = "https://repo.fortinet.com/repo/forticlient/7.2/ubuntu/DEB-GPG-KEY"
key_file = "/usr/share/keyrings/repo.fortinet.com.gpg"
key_install = "dearmor_output"
key_mode = ""
key_fingerprints = ["264E114C6911D08D3BA6CE6C18AC26395E54716D"]
source_file = "/etc/apt/sources.list.d/repo.fortinet.com.list"
source_format = "deb"
source_suite = "stable"
source_architectures = "amd64"
source_architecture = ""
components = "non-free"
legacy_source_files = []
# The branch this repository used to enroll. A laptop still carrying its
# FortiClient is moved onto the pinned branch by the next apply.
superseded_uris = ["https://repo.fortinet.com/repo/forticlient/8.0/ubuntu/"]
marker_file = "/var/lib/chezmoi/forticlient-stable"
package_names = ["forticlient"]
command_bindings = []
command_labels = []
adopt_existing = true
auxiliary_key_url = ""
auxiliary_key_file = ""
auxiliary_policy_url = ""
auxiliary_policy_file = ""

