# Codex CLI configuration
#
# Codex matches no commands against permission rules and has no allowlist.
# sandbox_mode decides what a command may touch, and approval_policy decides when
# Codex stops to ask. Ordinary developer commands — build, test, lint, git reads,
# package installs — run without a prompt; leaving the sandbox is an approval.

# Every command runs inside a sandbox with write access to the current workspace
# and $TMPDIR, and to no other part of the filesystem.
sandbox_mode = "workspace-write"

# No per-command question. Codex stops when it needs to escalate out of the
# sandbox, such as writing outside the workspace. "on-failure" is a deprecated
# alias for this policy in 0.144.x; "untrusted" asks for almost everything and
# "never" never asks.
approval_policy = "on-request"

[sandbox_workspace_write]
# Package installs, git fetch, and API calls reach the network from inside the
# sandbox. false makes network access an approval.
network_access = true

# Directories writable inside the sandbox beyond the workspace and $TMPDIR.
writable_roots = []
