name: Validate dotfiles

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v6

      - name: Validate bootstrap shell
        run: shellcheck install.sh

      - name: Check chezmoi version gate
        run: |
          bootstrap_version=$(awk -F '"' '/^readonly CHEZMOI_VERSION=/{print $2}' install.sh)
          source_version=$(tr -d '[:space:]' < home/.chezmoiversion)
          test "$bootstrap_version" = "$source_version"

      - name: Install pinned chezmoi
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsLS https://get.chezmoi.io | sh -s -- -b "$RUNNER_TEMP/bin" -t "v$(tr -d '[:space:]' < home/.chezmoiversion)"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Render source state without applying changes
        run: |
          chezmoi --use-builtin-diff --source "$GITHUB_WORKSPACE" --destination "$RUNNER_TEMP/home" init
          chezmoi --use-builtin-diff --source "$GITHUB_WORKSPACE" --destination "$RUNNER_TEMP/home" apply --dry-run --verbose --no-tty

      - name: Validate managed Zsh configuration
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends zsh
          zsh -n home/dot_zshrc home/dot_p10k.zsh
          chezmoi --source "$GITHUB_WORKSPACE" execute-template --file home/dot_zshrc > "$RUNNER_TEMP/.zshrc"
          bash tests/test-developer-path.sh "$RUNNER_TEMP/.zshrc"

      - name: Check rendered script syntax
        run: |
          template() {
            chezmoi --config /dev/null --config-format toml --no-tty --source "$GITHUB_WORKSPACE" execute-template --file "$1"
          }
          template home/.chezmoiscripts/run_onchange_before_10-install-ubuntu-packages.sh.tmpl > "$RUNNER_TEMP/install-ubuntu-packages.sh"
          template home/.chezmoiscripts/run_onchange_before_12-install-ubuntu-deb-artifacts.sh.tmpl > "$RUNNER_TEMP/install-ubuntu-deb-artifacts.sh"
          template home/.chezmoiscripts/run_onchange_after_17-install-aws-cli.sh.tmpl > "$RUNNER_TEMP/install-aws-cli.sh"
          template home/.chezmoiscripts/run_onchange_after_18-install-mise-tools.sh.tmpl > "$RUNNER_TEMP/install-mise-tools.sh"
          template home/.chezmoiscripts/run_onchange_after_19-install-vscode-extensions.sh.tmpl > "$RUNNER_TEMP/install-vscode-extensions.sh"
          template home/.chezmoiscripts/run_onchange_after_20-install-codex.sh.tmpl > "$RUNNER_TEMP/install-codex.sh"
          template home/.chezmoiscripts/run_onchange_after_05-ensure-sudo-group.sh.tmpl > "$RUNNER_TEMP/ensure-sudo-group.sh"
          template home/.chezmoiscripts/run_always_after_20-install-powerlevel10k.sh.tmpl > "$RUNNER_TEMP/install-powerlevel10k.sh"
          template home/.chezmoiscripts/run_always_after_21-install-developer-font.sh.tmpl > "$RUNNER_TEMP/install-developer-font.sh"
          template home/.chezmoiscripts/run_always_after_22-configure-repository-workspace.sh.tmpl > "$RUNNER_TEMP/configure-repository-workspace.sh"
          template home/.chezmoiscripts/run_onchange_after_30-install-matt-pocock-skills.sh.tmpl > "$RUNNER_TEMP/install-matt-pocock-skills.sh"
          template home/.chezmoiscripts/run_after_30-configure-ptyxis-font.sh.tmpl > "$RUNNER_TEMP/configure-ptyxis-font.sh"
          template home/.chezmoiscripts/run_always_after_35-configure-flameshot.sh.tmpl > "$RUNNER_TEMP/configure-flameshot.sh"
          template home/.chezmoiscripts/run_always_after_40-enable-nautilus-hidden-files.sh.tmpl > "$RUNNER_TEMP/enable-nautilus-hidden-files.sh"
          template home/dot_config/flameshot/flameshot.ini.tmpl > "$RUNNER_TEMP/flameshot.ini"
          template home/dot_local/bin/executable_flameshot-gui > "$RUNNER_TEMP/flameshot-gui"
          template home/dot_local/bin/executable_update-matt-pocock-skills.tmpl > "$RUNNER_TEMP/update-matt-pocock-skills"
          template home/dot_local/bin/executable_verify-1password-setup.tmpl > "$RUNNER_TEMP/verify-1password-setup"
          template home/.chezmoitemplates/ubuntu-package-foundation.sh > "$RUNNER_TEMP/ubuntu-package-foundation.sh"
          bash -n "$RUNNER_TEMP/install-ubuntu-packages.sh"
          shellcheck "$RUNNER_TEMP/install-ubuntu-packages.sh"
          tests/test-install-ubuntu-packages.sh "$RUNNER_TEMP/install-ubuntu-packages.sh"
          bash -n "$RUNNER_TEMP/install-ubuntu-deb-artifacts.sh"
          shellcheck "$RUNNER_TEMP/install-ubuntu-deb-artifacts.sh"
          tests/test-install-ubuntu-deb-artifacts.sh "$RUNNER_TEMP/install-ubuntu-deb-artifacts.sh"
          bash -n "$RUNNER_TEMP/install-aws-cli.sh"
          shellcheck "$RUNNER_TEMP/install-aws-cli.sh"
          tests/test-install-aws-cli.sh "$RUNNER_TEMP/install-aws-cli.sh"
          bash -n "$RUNNER_TEMP/install-mise-tools.sh"
          shellcheck "$RUNNER_TEMP/install-mise-tools.sh"
          bash -n "$RUNNER_TEMP/install-vscode-extensions.sh"
          shellcheck "$RUNNER_TEMP/install-vscode-extensions.sh"
          tests/test-install-vscode-extensions.sh "$RUNNER_TEMP/install-vscode-extensions.sh"
          bash -n "$RUNNER_TEMP/install-codex.sh"
          bash -n "$RUNNER_TEMP/ensure-sudo-group.sh"
          shellcheck "$RUNNER_TEMP/ensure-sudo-group.sh"
          tests/test-ensure-sudo-group.sh "$RUNNER_TEMP/ensure-sudo-group.sh"
          bash -n "$RUNNER_TEMP/install-powerlevel10k.sh"
          shellcheck "$RUNNER_TEMP/install-powerlevel10k.sh"
          bash -n "$RUNNER_TEMP/install-developer-font.sh"
          shellcheck "$RUNNER_TEMP/install-developer-font.sh"
          bash -n "$RUNNER_TEMP/configure-repository-workspace.sh"
          shellcheck "$RUNNER_TEMP/configure-repository-workspace.sh"
          tests/test-configure-repository-workspace.sh "$RUNNER_TEMP/configure-repository-workspace.sh"
          bash -n "$RUNNER_TEMP/install-matt-pocock-skills.sh"
          bash -n "$RUNNER_TEMP/configure-ptyxis-font.sh"
          shellcheck "$RUNNER_TEMP/configure-ptyxis-font.sh"
          bash -n "$RUNNER_TEMP/configure-flameshot.sh"
          shellcheck "$RUNNER_TEMP/configure-flameshot.sh"
          tests/test-configure-flameshot.sh "$RUNNER_TEMP/configure-flameshot.sh"
          bash -n "$RUNNER_TEMP/enable-nautilus-hidden-files.sh"
          bash -n "$RUNNER_TEMP/flameshot-gui"
          shellcheck "$RUNNER_TEMP/flameshot-gui"
          tests/test-flameshot-wayland-gui.sh "$RUNNER_TEMP/flameshot-gui"
          tests/test-flameshot-config.sh "$RUNNER_TEMP/flameshot.ini"
          bash -n "$RUNNER_TEMP/update-matt-pocock-skills"
          tests/test-update-matt-pocock-skills.sh "$RUNNER_TEMP/update-matt-pocock-skills"
          bash -n "$RUNNER_TEMP/verify-1password-setup"
          shellcheck "$RUNNER_TEMP/verify-1password-setup"
          tests/test-verify-1password-setup.sh "$RUNNER_TEMP/verify-1password-setup"
          bash -n "$RUNNER_TEMP/ubuntu-package-foundation.sh"
          tests/test-ubuntu-package-foundation.sh "$RUNNER_TEMP/ubuntu-package-foundation.sh"
          tests/test-mise-config.sh home/dot_config/mise/config.toml
          tests/test-tmux-config.sh home/dot_tmux.conf
          gpg --batch --show-keys --with-colons home/dot_local/share/aws-cli/aws-cli-team.asc | awk -F: '$1 == "fpr" { print $10; exit }' | grep -Fqx 'FB5DB77FD5C118B80511ADA8A6310ACC4672475C'
