name: Validate dotfiles

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v6

      - name: Validate bootstrap shell
        run: shellcheck install.sh

      - name: Check chezmoi version gate
        run: |
          bootstrap_version=$(awk -F '"' '/^readonly CHEZMOI_VERSION=/{print $2}' install.sh)
          source_version=$(tr -d '[:space:]' < home/.chezmoiversion)
          test "$bootstrap_version" = "$source_version"

      - name: Install pinned chezmoi
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsLS https://get.chezmoi.io | sh -s -- -b "$RUNNER_TEMP/bin" -t "v$(tr -d '[:space:]' < home/.chezmoiversion)"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Render source state without applying changes
        run: |
          chezmoi --source "$GITHUB_WORKSPACE" --destination "$RUNNER_TEMP/home" init
          chezmoi --source "$GITHUB_WORKSPACE" --destination "$RUNNER_TEMP/home" apply --dry-run --verbose

      - name: Validate managed Zsh configuration
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends zsh
          zsh -n home/dot_zshrc

      - name: Check rendered script syntax
        run: |
          chezmoi --source "$GITHUB_WORKSPACE" execute-template --file home/.chezmoiscripts/run_onchange_before_10-install-ubuntu-packages.sh.tmpl > "$RUNNER_TEMP/install-ubuntu-packages.sh"
          chezmoi --source "$GITHUB_WORKSPACE" execute-template --file home/.chezmoiscripts/run_onchange_after_20-install-codex.sh.tmpl > "$RUNNER_TEMP/install-codex.sh"
          chezmoi --source "$GITHUB_WORKSPACE" execute-template --file home/.chezmoiscripts/run_onchange_after_30-install-matt-pocock-skills.sh.tmpl > "$RUNNER_TEMP/install-matt-pocock-skills.sh"
          chezmoi --source "$GITHUB_WORKSPACE" execute-template --file home/.chezmoiscripts/run_always_after_40-enable-nautilus-hidden-files.sh.tmpl > "$RUNNER_TEMP/enable-nautilus-hidden-files.sh"
          chezmoi --source "$GITHUB_WORKSPACE" execute-template --file home/dot_local/bin/executable_update-matt-pocock-skills.tmpl > "$RUNNER_TEMP/update-matt-pocock-skills"
          bash -n "$RUNNER_TEMP/install-ubuntu-packages.sh"
          bash -n "$RUNNER_TEMP/install-codex.sh"
          bash -n "$RUNNER_TEMP/install-matt-pocock-skills.sh"
          bash -n "$RUNNER_TEMP/enable-nautilus-hidden-files.sh"
          bash -n "$RUNNER_TEMP/update-matt-pocock-skills"
