name: Validate dotfiles

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v6

      - name: Check chezmoi version gate
        run: |
          bootstrap_version=$(awk -F '"' '/^readonly CHEZMOI_VERSION=/{print $2}' install.sh)
          source_version=$(tr -d '[:space:]' < home/.chezmoiversion)
          test "$bootstrap_version" = "$source_version"

      - name: Install pinned chezmoi
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsLS https://get.chezmoi.io | sh -s -- -b "$RUNNER_TEMP/bin" -t "v$(tr -d '[:space:]' < home/.chezmoiversion)"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install Zsh
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends zsh

      # Renders and checks every program the source tree contains, under every
      # bootstrap profile. The inventory comes from the tree, so a new script
      # cannot fall out of CI.
      - name: Check source state
        run: tests/lint-sources.sh

      # Every tests/test-*.sh. Each test names its own inputs through the
      # fixture, so there is nothing to pass here.
      - name: Run tests
        run: tests/run-tests.sh

      - name: Render source state without applying changes
        run: |
          chezmoi --use-builtin-diff --source "$GITHUB_WORKSPACE" --destination "$RUNNER_TEMP/home" init \
            --promptChoice 'Which bootstrap profile should be active?=default' \
            --promptString 'Git author name=CI User' \
            --promptString 'Git author email=ci@example.invalid'
          chezmoi --use-builtin-diff --source "$GITHUB_WORKSPACE" --destination "$RUNNER_TEMP/home" apply --dry-run --verbose --no-tty
